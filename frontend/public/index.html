<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Chat & Game Wibu 2D</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: manipulation; }
        body { display: flex; justify-content: flex-start; align-items: center; min-height: 100vh; padding: 20px; background: url('anhnen1.jpg') no-repeat center center fixed; background-size: cover; position: relative; gap: 20px; }
        body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.35); z-index: 0; }
        .chat-container { position: relative; z-index: 1; width: 340px; max-width: 100%; padding: 20px; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); border-radius: 18px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.5); flex-shrink: 0; }
        .chat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid rgba(0, 0, 0, 0.08); }
        .chat-icon { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #6c5ce7; }
        .chat-header h2 { font-size: 1.2rem; color: #2d3436; }
        #chat-box { width: 100%; height: 200px; border: 1px solid #e0e0e0; background: #ffffff; overflow-y: auto; padding: 12px; margin-bottom: 12px; border-radius: 12px; }
        #chat-box p { margin-bottom: 8px; line-height: 1.4; color: #2d3436; word-wrap: break-word; }
        #chat-box p strong { color: #6c5ce7; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-row { display: flex; gap: 6px; }
        input[type="text"] { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 0.95rem; }
        #usernameInput { width: 100%; } #messageInput { flex: 1; }
        button { padding: 10px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; user-select: none; }
        button:active { transform: scale(0.96); }
        .btn-send { background-color: #6c5ce7; color: white; }
        .btn-clear { background-color: #ff4d4d; color: white; }
        .game-container { position: relative; z-index: 1; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); padding: 15px; border-radius: 18px; border: 2px solid rgba(255, 255, 255, 0.3); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .select-player-box { display: flex; gap: 10px; background: rgba(255, 255, 255, 0.2); padding: 8px 15px; border-radius: 12px; width: 100%; justify-content: center; align-items: center; }
        .btn-select { background-color: #00b894; color: white; padding: 8px 14px; font-size: 0.85rem; }
        .btn-active { background-color: #e67e22 !important; color: white; }
        .btn-restart { background-color: #0984e3; color: white; padding: 8px 14px; font-size: 0.85rem; }
        #gameCanvas { border-radius: 12px; display: block; border: 2px solid #ccc; background: #ffffff; max-width: 100%; height: auto; }
        .mobile-controls { display: flex; justify-content: space-between; width: 100%; margin-top: 10px; gap: 10px; }
        .touch-group { display: flex; gap: 8px; }
        .btn-touch { width: 50px; height: 50px; border-radius: 50%; border: none; background: rgba(255, 255, 255, 0.25); color: white; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); backdrop-filter: blur(5px); }
        .btn-touch:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.92); }
        .btn-action { background: rgba(108, 92, 231, 0.6); }
        .btn-block { background: rgba(46, 204, 113, 0.6); }
        .btn-secret { background: rgba(231, 76, 60, 0.6); }
        @media (min-width: 901px) { .mobile-controls { display: none; } }
        @media (max-width: 900px) { body { flex-direction: column-reverse; justify-content: center; padding: 10px; } .chat-container { width: 100%; } .game-container { width: 100%; } }

        /* Màn hình chờ Sharingan Intro */
        #sharingan-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.3s ease-out;
        }

        .sharingan-intro-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            animation: spinClockwise 2s linear infinite;
        }

        @keyframes spinClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Màn hình chờ Sharingan -->
    <div id="sharingan-intro">
        <img src="sharingan.jpg" alt="Sharingan Intro" class="sharingan-intro-img">
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <img src="icon.jpg" alt="Icon" class="chat-icon" onerror="this.src='https://via.placeholder.com/44'">
            <h2>App chat wibu</h2>
        </div>
        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Tên của bạn...">
            <div class="input-row">
                <input type="text" id="messageInput" placeholder="Nhập tin nhắn...">
                <button onclick="sendMessage()" class="btn-send">Gửi</button>
                <button onclick="clearChat()" class="btn-clear">Xóa</button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="select-player-box">
            <button id="btnP1" onclick="toggleRole('p1')" class="btn-select">Chọn Player 1</button>
            <button id="btnP2" onclick="toggleRole('p2')" class="btn-select">Chọn Player 2</button>
            <button onclick="restartGame()" class="btn-restart">Chơi lại 🔄</button>
        </div>

        <canvas id="gameCanvas" width="500" height="400"></canvas>

        <div class="mobile-controls">
            <div class="touch-group">
                <button class="btn-touch" id="btnLeft">◀</button>
                <button class="btn-touch" id="btnRight">▶</button>
                <button class="btn-touch" id="btnJump">▲</button>
            </div>
            <div class="touch-group">
                <button class="btn-touch btn-action" id="btnAttack">⚔️</button>
                <button class="btn-touch btn-block" id="btnShield">🛡️</button>
                <button class="btn-touch btn-secret" id="btnE">👁️</button>
            </div>
        </div>
    </div>

    <script>
        // Tự ẩn màn hình intro Sharingan sau 2 giây
        window.addEventListener('DOMContentLoaded', () => {
            const intro = document.getElementById('sharingan-intro');
            setTimeout(() => {
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                }, 300);
            }, 2000);
        });

        const socket = io('https://congamewibu.onrender.com');
        const usernameInput = document.getElementById('usernameInput');
        const messageInput = document.getElementById('messageInput');
        const chatBox = document.getElementById('chat-box');

        window.onload = () => {
            const history = JSON.parse(localStorage.getItem('chat_history')) || [];
            history.forEach(data => addMessageToBox(data));
        };

        function addMessageToBox(data) {
            const msgElement = document.createElement('p');
            msgElement.innerHTML = `<strong>${data.username}:</strong> ${data.message}`;
            chatBox.appendChild(msgElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const username = usernameInput.value.trim() || 'Wibu Ẩn Danh';
            const message = messageInput.value.trim();
            if (message !== '') {
                socket.emit('send_message', { username, message });
                messageInput.value = '';
            }
        }

        socket.on('receive_message', (data) => {
            addMessageToBox(data);
            const history = JSON.parse(localStorage.getItem('chat_history')) || [];
            history.push(data);
            localStorage.setItem('chat_history', JSON.stringify(history));
        });

        function clearChat() {
            if (confirm("Xóa lịch sử chat?")) {
                localStorage.removeItem('chat_history');
                chatBox.innerHTML = '';
            }
        }

        // --- GAME LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const p1Img = new Image(); p1Img.src = 'player1.png';
        const p2Img = new Image(); p2Img.src = 'player2.png';
        const sharinganImg = new Image(); sharinganImg.src = 'sharingan1.jpg';

        const groundY = 320;
        const gravity = 0.6;
        const jumpPower = -12;

        let myRole = null;
        let isGameOver = false;

        let players = {
            p1: { x: 50, y: groundY - 80, size: 80, vy: 0, isGrounded: true, hp: 5, active: false, direction: 1, isAttacking: false, isBlocking: false, hitTimer: 0, walkFrame: 0 },
            p2: { x: 370, y: groundY - 80, size: 80, vy: 0, isGrounded: true, hp: 5, active: false, direction: -1, isAttacking: false, isBlocking: false, hitTimer: 0, walkFrame: 0 }
        };

        let sharinganSkill = { active: false, x: 0, y: 0, angle: 0 };
        let handSkill = { active: false, x: 0, y: 0 };

        socket.on('init_state', (data) => {
            if (data.gameState.p1) players.p1 = { ...players.p1, ...data.gameState.p1 };
            if (data.gameState.p2) players.p2 = { ...players.p2, ...data.gameState.p2 };
            updateRoleButtonsUI();
        });

        function toggleRole(role) {
            if (myRole === role) {
                myRole = null;
            } else {
                myRole = role;
            }
            socket.emit('toggle_role', role);
        }

        socket.on('role_updated', (data) => {
            players[data.role].active = data.active;
            updateRoleButtonsUI();
        });

        function updateRoleButtonsUI() {
            const btnP1 = document.getElementById('btnP1');
            const btnP2 = document.getElementById('btnP2');

            if (myRole === 'p1') {
                btnP1.innerText = "Đang chọn P1 🟢";
                btnP1.className = "btn-select btn-active";
            } else {
                btnP1.innerText = "Chọn Player 1";
                btnP1.className = "btn-select";
            }

            if (myRole === 'p2') {
                btnP2.innerText = "Đang chọn P2 🟢";
                btnP2.className = "btn-select btn-active";
            } else {
                btnP2.innerText = "Chọn Player 2";
                btnP2.className = "btn-select";
            }
        }

        function restartGame() {
            socket.emit('restart_game');
        }

        socket.on('game_restarted', (data) => {
            isGameOver = false;
            players.p1 = { ...players.p1, ...data.gameState.p1 };
            players.p2 = { ...players.p2, ...data.gameState.p2 };
            sharinganSkill.active = false;
            handSkill.active = false;
        });

        let keys = {};
        window.addEventListener('keydown', (e) => { 
            let key = e.key.toLowerCase();
            keys[key] = true; 
            if (isGameOver || !myRole) return;

            if ((key === 'w' || key === ' ') && players[myRole].isGrounded) {
                players[myRole].vy = jumpPower;
                players[myRole].isGrounded = false;
            }
            if (key === 'j' && !players[myRole].isAttacking) performAttack();
            if (key === 'e') triggerSpecialSkill();
        });

        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function setupTouchBtn(btnId, keyName) {
            const btn = document.getElementById(btnId);
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys[keyName] = true;
                if (!myRole || isGameOver) return;

                if (keyName === 'w' && players[myRole].isGrounded) {
                    players[myRole].vy = jumpPower;
                    players[myRole].isGrounded = false;
                }
                if (keyName === 'j' && !players[myRole].isAttacking) performAttack();
                if (keyName === 'e') triggerSpecialSkill();
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[keyName] = false;
            });
        }

        setupTouchBtn('btnLeft', 'a');
        setupTouchBtn('btnRight', 'd');
        setupTouchBtn('btnJump', 'w');
        setupTouchBtn('btnAttack', 'j');
        setupTouchBtn('btnShield', 'k');
        setupTouchBtn('btnE', 'e');

        function performAttack() {
            socket.emit('attack', myRole);
        }

        function triggerSpecialSkill() {
            if (myRole === 'p1' && !sharinganSkill.active) {
                socket.emit('trigger_sharingan');
            } else if (myRole === 'p2' && !handSkill.active) {
                socket.emit('trigger_hand_skill');
            }
        }

        socket.on('game_state_sync', (data) => {
            if (data.gameState.p1) players.p1.hp = data.gameState.p1.hp;
            if (data.gameState.p2) players.p2.hp = data.gameState.p2.hp;
            if (data.gameState.p1) players.p1.hitTimer = data.gameState.p1.hitTimer;
            if (data.gameState.p2) players.p2.hitTimer = data.gameState.p2.hitTimer;

            if (data.attackerRole) {
                players[data.attackerRole].isAttacking = true;
                setTimeout(() => { players[data.attackerRole].isAttacking = false; }, 250);
            }
        });

        socket.on('sharingan_activated', (data) => {
            sharinganSkill.active = true;
            if (data.gameState) {
                players.p1.hp = data.gameState.p1.hp;
                players.p2.hp = data.gameState.p2.hp;
                players.p2.hitTimer = data.gameState.p2.hitTimer;
            }
        });
        socket.on('sharingan_deactivated', () => { sharinganSkill.active = false; });

        socket.on('hand_skill_activated', (data) => {
            handSkill.active = true;
            if (data.gameState) {
                players.p1.hp = data.gameState.p1.hp;
                players.p2.hp = data.gameState.p2.hp;
                players.p1.hitTimer = data.gameState.p1.hitTimer;
            }
        });
        socket.on('hand_skill_deactivated', () => { handSkill.active = false; });

        socket.on('player_updated', (data) => {
            if (data.role !== myRole) {
                players[data.role] = { ...players[data.role], ...data.data };
            }
        });

        function updateGame() {
            if (!isGameOver && myRole && players[myRole]) {
                let p = players[myRole];
                p.isBlocking = keys['k'] || false;

                if (keys['a']) {
                    p.x = Math.max(0, p.x - 4);
                    p.direction = -1;
                    p.walkFrame += 0.25;
                } else if (keys['d']) {
                    p.x = Math.min(canvas.width - p.size, p.x + 4);
                    p.direction = 1;
                    p.walkFrame += 0.25;
                } else {
                    p.walkFrame = 0;
                }

                p.vy += gravity;
                p.y += p.vy;

                if (p.y + p.size >= groundY) {
                    p.y = groundY - p.size;
                    p.vy = 0;
                    p.isGrounded = true;
                }

                socket.emit('update_player', { role: myRole, data: p });
            }

            if (players.p1.hitTimer > 0) players.p1.hitTimer--;
            if (players.p2.hitTimer > 0) players.p2.hitTimer--;

            if (players.p1.hp <= 0 || players.p2.hp <= 0) {
                isGameOver = true;
            }

            if (sharinganSkill.active) {
                sharinganSkill.x = players.p2.x + players.p2.size / 2;
                sharinganSkill.y = players.p2.y + 10;
                sharinganSkill.angle += 0.1;
            }

            if (handSkill.active) {
                handSkill.x = players.p1.x + players.p1.size / 2;
                handSkill.y = players.p1.y - 40;
            }

            drawGame();
            requestAnimationFrame(updateGame);
        }

        function drawGame() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#8e44ad';
            ctx.fillRect(0, groundY, canvas.width, 5);
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(0, groundY + 5, canvas.width, canvas.height - groundY - 5);

            drawCharacter(players.p1, p1Img, '#6c5ce7', 'P1');
            drawCharacter(players.p2, p2Img, '#e74c3c', 'P2');

            if (sharinganSkill.active && !isGameOver) {
                ctx.save();
                ctx.translate(sharinganSkill.x, sharinganSkill.y);
                ctx.rotate(sharinganSkill.angle);
                if (sharinganImg.complete && sharinganImg.naturalWidth !== 0) {
                    ctx.drawImage(sharinganImg, -35, -35, 70, 70);
                } else {
                    ctx.fillStyle = 'red';
                    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }

            if (handSkill.active && !isGameOver) {
                ctx.save();
                ctx.translate(handSkill.x, handSkill.y);
                ctx.font = '55px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#e74c3c';
                ctx.shadowBlur = 15;
                ctx.fillText('🖐️', 0, 0);
                ctx.restore();
            }

            ctx.fillStyle = '#2d3436';
            ctx.font = 'bold 15px Arial';
            ctx.fillText(`P1: ${'❤️'.repeat(players.p1.hp)}`, 15, 25);
            ctx.fillText(`P2: ${'❤️'.repeat(players.p2.hp)}`, 360, 25);

            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff4d4d';
                ctx.font = 'bold 42px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

                let winner = (players.p1.hp > 0) ? 'PLAYER 1 CHIẾN THẮNG! 🏆' : (players.p2.hp > 0) ? 'PLAYER 2 CHIẾN THẮNG! 🏆' : 'HÒA NHANH!';
                ctx.fillStyle = '#ffeaa7';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(winner, canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function drawCharacter(p, img, fallbackColor, label) {
            ctx.save();
            let centerX = p.x + p.size / 2;
            let centerY = p.y + p.size / 2;

            let bounceY = 0;
            let tiltAngle = 0;
            if (p.walkFrame > 0 && p.isGrounded && !isGameOver) {
                bounceY = Math.sin(p.walkFrame * 2) * 5;
                tiltAngle = Math.cos(p.walkFrame) * 0.1 * p.direction;
            }

            let hitShakeX = (p.hitTimer > 0) ? Math.sin(p.hitTimer * 0.5) * 4 : 0;

            ctx.translate(centerX + hitShakeX, centerY + bounceY);
            ctx.rotate(tiltAngle);

            if (p.direction === -1) ctx.scale(-1, 1);
            
            if (p.hitTimer > 0) {
                ctx.filter = 'brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(5)';
            }

            if (img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, -p.size / 2, -p.size / 2, p.size, p.size);
            } else {
                ctx.fillStyle = fallbackColor;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(label, 0, 5);
            }

            ctx.filter = 'none';

            if (p.isAttacking) {
                ctx.beginPath();
                ctx.strokeStyle = '#ff7675';
                ctx.lineWidth = 8;
                ctx.arc(15, 0, 45, -Math.PI / 3, Math.PI / 3);
                ctx.stroke();
            }

            ctx.restore();

            if (p.isBlocking && !isGameOver) {
                ctx.fillStyle = 'rgba(52, 152, 219, 0.4)';
                ctx.strokeStyle = '#2980b9';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(centerX, centerY, p.size / 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        updateGame();
    </script>
</body>
</html>
