<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Đổi Nhân Vật & Reset</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #1e1e2e;
      color: #ffffff;
    }

    h1 {
      margin-bottom: 10px;
    }

    /* Màn hình Game */
    #game-container {
      position: relative;
      width: 600px;
      height: 400px;
      background-color: #2b2b3d;
      border: 3px solid #444466;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    /* Bảng thông tin (Điểm số, Thời gian) */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      z-index: 10;
    }

    /* Nhân vật */
    #player {
      position: absolute;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      color: #fff;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    /* Vật phẩm thu thập */
    #coin {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffd700;
    }

    /* Khu vực chứa Nút bấm */
    #controls {
      margin-top: 20px;
      display: flex;
      gap: 20px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .btn:active {
      transform: scale(0.95);
    }

    #btn-change-char {
      background-color: #89b4fa;
      color: #11111b;
    }
    #btn-change-char:hover {
      background-color: #b4befe;
    }

    #btn-restart {
      background-color: #f38ba8;
      color: #11111b;
    }
    #btn-restart:hover {
      background-color: #f5e0dc;
    }

    .guide {
      margin-top: 15px;
      font-size: 14px;
      color: #a6adc8;
    }
  </style>
</head>
<body>

  <h1>Demo Game</h1>

  <!-- Màn chơi chính -->
  <div id="game-container">
    <div id="hud">
      <div>Điểm: <span id="score">0</span></div>
      <div>Thời gian: <span id="timer">30</span>s</div>
    </div>
    <div id="player">NV 1</div>
    <div id="coin"></div>
  </div>

  <!-- Bảng nút điều khiển -->
  <div id="controls">
    <button id="btn-change-char" class="btn">Đổi Nhân Vật: Nhân vật 1</button>
    <button id="btn-restart" class="btn">Chơi Lại Toàn Bộ</button>
  </div>

  <p class="guide">Sử dụng các phím mũi tên <b>W, A, S, D</b> hoặc <b>mũi tên điều hướng</b> để di chuyển.</p>

  <script>
    // --- 1. DANH SÁCH NHÂN VẬT ---
    const characters = [
      { id: 1, name: "Nhân vật 1 (Cơ bản)", color: "#f38ba8", size: 40, speed: 5 },
      { id: 2, name: "Nhân vật 2 (Tốc độ)", color: "#a6e3a1", size: 30, speed: 9 },
      { id: 3, name: "Nhân vật 3 (Khổng lồ)", color: "#fab387", size: 60, speed: 3 }
    ];

    let currentCharIndex = 0;
    let score = 0;
    let timeLeft = 30;
    let gameInterval = null;
    let isGameOver = false;

    // Vị trí nhân vật & vật phẩm
    let playerPos = { x: 50, y: 50 };
    let coinPos = { x: 300, y: 200 };
    const keysPressed = {};

    // Element DOM
    const playerEl = document.getElementById("player");
    const coinEl = document.getElementById("coin");
    const scoreEl = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const btnChangeChar = document.getElementById("btn-change-char");
    const btnRestart = document.getElementById("btn-restart");

    // --- 2. CÀI ĐẶT NHÂN VẬT HỆ THỐNG ---
    function applyCharacterStats() {
      const char = characters[currentCharIndex];
      
      // Cập nhật giao diện nút
      btnChangeChar.innerText = `Đổi Nhân Vật: ${char.name}`;

      // Cập nhật hiển thị nhân vật trên màn chơi
      playerEl.style.width = char.size + "px";
      playerEl.style.height = char.size + "px";
      playerEl.style.backgroundColor = char.color;
      playerEl.innerText = `NV ${char.id}`;
    }

    // --- 3. NÚT 1: ĐỔI NHÂN VẬT ---
    btnChangeChar.addEventListener("click", () => {
      // Chuyển sang nhân vật kế tiếp trong danh sách (Chuyển vòng)
      currentCharIndex = (currentCharIndex + 1) % characters.length;
      applyCharacterStats();
    });

    // --- 4. NÚT 2: CHƠI LẠI TOÀN BỘ ---
    btnRestart.addEventListener("click", () => {
      resetGame();
    });

    function resetGame() {
      // Reset chỉ số game
      score = 0;
      timeLeft = 30;
      isGameOver = false;
      scoreEl.innerText = score;
      timerEl.innerText = timeLeft;

      // Reset vị trí nhân vật về góc
      playerPos = { x: 50, y: 50 };
      updatePlayerPosition();

      // Đặt lại vị trí điểm thưởng
      spawnCoin();

      // Reset Đếm thời gian
      clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          timerEl.innerText = timeLeft;
        } else {
          isGameOver = true;
          clearInterval(gameInterval);
          alert(`Hết giờ! Điểm của bạn là: ${score}`);
        }
      }, 1000);
    }

    function spawnCoin() {
      coinPos.x = Math.floor(Math.random() * (600 - 30));
      coinPos.y = Math.floor(Math.random() * (400 - 30 - 40)) + 40; // Tránh thanh HUD phía trên
      coinEl.style.left = coinPos.x + "px";
      coinEl.style.top = coinPos.y + "px";
    }

    function updatePlayerPosition() {
      playerEl.style.left = playerPos.x + "px";
      playerEl.style.top = playerPos.y + "px";
    }

    // --- 5. LOGIC DI CHUYỂN & VÒNG LẶP GAME ---
    window.addEventListener("keydown", (e) => { keysPressed[e.key] = true; });
    window.addEventListener("keyup", (e) => { keysPressed[e.key] = false; });

    function gameLoop() {
      if (!isGameOver) {
        const currentChar = characters[currentCharIndex];
        const speed = currentChar.speed;

        // Xử lý di chuyển
        if (keysPressed["ArrowUp"] || keysPressed["w"]) playerPos.y = Math.max(0, playerPos.y - speed);
        if (keysPressed["ArrowDown"] || keysPressed["s"]) playerPos.y = Math.min(400 - currentChar.size, playerPos.y + speed);
        if (keysPressed["ArrowLeft"] || keysPressed["a"]) playerPos.x = Math.max(0, playerPos.x - speed);
        if (keysPressed["ArrowRight"] || keysPressed["d"]) playerPos.x = Math.min(600 - currentChar.size, playerPos.x + speed);

        updatePlayerPosition();

        // Kiểm tra va chạm với Đồng xu (Ăn điểm)
        if (
          playerPos.x < coinPos.x + 20 &&
          playerPos.x + currentChar.size > coinPos.x &&
          playerPos.y < coinPos.y + 20 &&
          playerPos.y + currentChar.size > coinPos.y
        ) {
          score += 10;
          scoreEl.innerText = score;
          spawnCoin();
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // --- Khởi tạo ban đầu ---
    applyCharacterStats();
    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
