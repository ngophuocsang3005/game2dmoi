<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App chat tầm bậy wibu</title>
    <!-- Socket.io CDN -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: flex-start; /* Đẩy khung chat về góc bên TAY TRÁI */
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            /* Ảnh nền anhnen1.jpg phủ kín toàn trang */
            background: url('anhnen1.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Lớp phủ mờ nhẹ tôn khung chat lên */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 0;
        }

        /* Container khung chat chính */
        .chat-container {
            position: relative;
            z-index: 1;
            width: 380px;
            max-width: 100%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin-left: 10px; /* Tạo khoảng nghỉ nhẹ sát mép trái */
        }

        /* Header chứa Icon & Tiêu đề */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.08);
        }

        .chat-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #6c5ce7;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .chat-header h2 {
            font-size: 1.2rem;
            color: #2d3436;
            font-weight: 700;
        }

        /* Ô chat hiển thị tin nhắn */
        #chat-box {
            width: 100%;
            height: 300px;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
        }

        #chat-box p {
            margin-bottom: 8px;
            line-height: 1.4;
            color: #2d3436;
            word-wrap: break-word;
        }

        #chat-box p strong {
            color: #6c5ce7;
        }

        /* Khu vực nhập nội dung */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-row {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 8px rgba(108, 92, 231, 0.3);
        }

        #usernameInput {
            width: 100%;
        }

        #messageInput {
            flex: 1;
        }

        /* Thiết kế nút bấm */
        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-send {
            background-color: #6c5ce7;
            color: white;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
        }

        .btn-send:hover {
            background-color: #5b4bc4;
        }

        .btn-clear {
            background-color: #ff4d4d;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.3);
        }

        .btn-clear:hover {
            background-color: #e03e3e;
        }

        /* TỐI ƯU GIAO DIỆN CHO ĐIỆN THOẠI (Responsive Mobile) */
        @media (max-width: 768px) {
            body {
                justify-content: center; /* Trở về giữa màn hình khi xem trên điện thoại */
                padding: 12px;
            }

            .chat-container {
                width: 100%;
                margin-left: 0;
                padding: 16px;
                border-radius: 14px;
            }

            #chat-box {
                height: 260px; /* Thu gọn độ cao một chút trên điện thoại */
            }

            input[type="text"], button {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header có icon.jpg -->
        <div class="chat-header">
            <img src="icon.jpg" alt="Icon" class="chat-icon" onerror="this.src='https://via.placeholder.com/44'">
            <h2>App chat tầm bậy wibu</h2>
        </div>

        <!-- Khung chat -->
        <div id="chat-box"></div>

        <!-- Ô nhập tin nhắn & Nút bấm -->
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Tên của bạn...">
            <div class="input-row">
                <input type="text" id="messageInput" placeholder="Nhập tin nhắn...">
                <button onclick="sendMessage()" class="btn-send">Gửi</button>
                <button onclick="clearChat()" class="btn-clear">Xóa</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io('https://congamewibu.onrender.com');

        const usernameInput = document.getElementById('usernameInput');
        const messageInput = document.getElementById('messageInput');
        const chatBox = document.getElementById('chat-box');

        // Tải lại lịch sử tin nhắn từ máy khi vào trang
        window.onload = () => {
            const history = JSON.parse(localStorage.getItem('chat_history')) || [];
            history.forEach(data => addMessageToBox(data));
        };

        function addMessageToBox(data) {
            const msgElement = document.createElement('p');
            msgElement.innerHTML = `<strong>${data.username}:</strong> ${data.message}`;
            chatBox.appendChild(msgElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const username = usernameInput.value.trim() || 'Wibu Ẩn Danh';
            const message = messageInput.value.trim();

            if (message !== '') {
                socket.emit('send_message', { username, message });
                messageInput.value = '';
            }
        }

        // Lắng nghe nhận tin nhắn mới
        socket.on('receive_message', (data) => {
            addMessageToBox(data);

            const history = JSON.parse(localStorage.getItem('chat_history')) || [];
            history.push(data);
            localStorage.setItem('chat_history', JSON.stringify(history));
        });

        // Xóa lịch sử chat
        function clearChat() {
            if (confirm("M có chắc muốn xóa sạch lịch sử chat trên máy này không?")) {
                localStorage.removeItem('chat_history');
                chatBox.innerHTML = '';
            }
        }
    </script>
</body>
</html>
