<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Chat & Game Wibu 2D</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            display: flex; justify-content: flex-start; align-items: center;
            min-height: 100vh; padding: 20px;
            background: url('anhnen1.jpg') no-repeat center center fixed;
            background-size: cover; position: relative; gap: 20px;
        }

        body::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35); z-index: 0;
        }

        /* KHUNG CHAT */
        .chat-container {
            position: relative; z-index: 1; width: 340px; max-width: 100%; padding: 20px;
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px);
            border-radius: 18px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5); flex-shrink: 0;
        }

        .chat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid rgba(0, 0, 0, 0.08); }
        .chat-icon { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #6c5ce7; }
        .chat-header h2 { font-size: 1.2rem; color: #2d3436; }

        #chat-box { width: 100%; height: 280px; border: 1px solid #e0e0e0; background: #ffffff; overflow-y: auto; padding: 12px; margin-bottom: 12px; border-radius: 12px; }
        #chat-box p { margin-bottom: 8px; line-height: 1.4; color: #2d3436; word-wrap: break-word; }
        #chat-box p strong { color: #6c5ce7; }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-row { display: flex; gap: 6px; }
        input[type="text"] { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 0.95rem; }
        #usernameInput { width: 100%; } #messageInput { flex: 1; }

        button { padding: 10px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        button:active { transform: scale(0.96); }
        button:disabled { background-color: #b2bec3 !important; cursor: not-allowed; }
        .btn-send { background-color: #6c5ce7; color: white; }
        .btn-clear { background-color: #ff4d4d; color: white; }

        /* KHUNG GAME */
        .game-container {
            position: relative; z-index: 1; background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px); padding: 15px; border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        .select-player-box { display: flex; gap: 10px; background: rgba(255, 255, 255, 0.2); padding: 8px 15px; border-radius: 12px; width: 100%; justify-content: center; align-items: center; }
        .btn-select { background-color: #00b894; color: white; padding: 8px 14px; font-size: 0.85rem; }
        .btn-restart { background-color: #e67e22; color: white; padding: 8px 14px; font-size: 0.85rem; }

        #gameCanvas { border-radius: 12px; display: block; border: 2px solid #ccc; background: #ffffff; }
        .guide-text { color: #ffeaa7; font-size: 0.82rem; text-align: center; line-height: 1.5; }

        @media (max-width: 900px) {
            body { flex-direction: column-reverse; justify-content: center; padding: 10px; }
            .chat-container { width: 100%; } .game-container { width: 100%; }
            #gameCanvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <img src="icon.jpg" alt="Icon" class="chat-icon" onerror="this.src='https://via.placeholder.com/44'">
            <h2>App chat wibu</h2>
        </div>
        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Tên của bạn...">
            <div class="input-row">
                <input type="text" id="messageInput" placeholder="Nhập tin nhắn...">
                <button onclick="sendMessage()" class="btn-send">Gửi</button>
                <button onclick="clearChat()" class="btn-clear">Xóa</button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="select-player-box">
            <button id="btnP1" onclick="selectRole('p1')" class="btn-select">Chọn Player 1</button>
            <button id="btnP2" onclick="selectRole('p2')" class="btn-select">Chọn Player 2</button>
            <button onclick="restartGame()" class="btn-restart">Chơi lại 🔄</button>
        </div>

        <canvas id="gameCanvas" width="500" height="400"></canvas>
        
        <div class="guide-text">
            🎮 <b>Di chuyển</b>: A - D | 🦘 <b>Nhảy</b>: W / SPACE <br>
            ⚔️ <b>Đánh thường</b>: Phím J | 🛡️ <b>Block</b>: Phím K
        </div>
    </div>

    <script>
        // --- 1. CHAT LOGIC ---
        const socket = io('https://congamewibu.onrender.com');
        const usernameInput = document.getElementById('usernameInput');
        const messageInput = document.getElementById('messageInput');
        const chatBox = document.getElementById('chat-box');

        window.onload = () => {
            const history = JSON.parse(localStorage.getItem('chat_history')) || [];
            history.forEach(data => addMessageToBox(data));
            selectRole('p1');
        };

        function addMessageToBox(data) {
            const msgElement = document.createElement('p');
            msgElement.innerHTML = `<strong>${data.username}:</strong> ${data.message}`;
            chatBox.appendChild(msgElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const username = usernameInput.value.trim() || 'Wibu Ẩn Danh';
            const message = messageInput.value.trim();
            if (message !== '') {
                socket.emit('send_message', { username, message });
                messageInput.value = '';
            }
        }

        socket.on('receive_message', (data) => {
            addMessageToBox(data);
            const history = JSON.parse(localStorage.getItem('chat_history')) || [];
            history.push(data);
            localStorage.setItem('chat_history', JSON.stringify(history));
        });

        function clearChat() {
            if (confirm("Xóa lịch sử chat?")) {
                localStorage.removeItem('chat_history');
                chatBox.innerHTML = '';
            }
        }

        // --- 2. GAME LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const p1Img = new Image(); p1Img.src = 'player1.png';
        const p2Img = new Image(); p2Img.src = 'player2.png';
        const sharinganImg = new Image(); sharinganImg.src = 'sharingan1.jpg';

        const groundY = 320;
        const gravity = 0.6;
        const jumpPower = -12;

        let myRole = 'p1';
        let isGameOver = false;

        let players = {
            p1: { x: 50, y: groundY - 80, size: 80, vy: 0, isGrounded: true, hp: 5, active: true, direction: 1, isAttacking: false, isBlocking: false, hitTimer: 0, walkFrame: 0 },
            p2: { x: 370, y: groundY - 80, size: 80, vy: 0, isGrounded: true, hp: 5, active: true, direction: -1, isAttacking: false, isBlocking: false, hitTimer: 0, walkFrame: 0 }
        };

        let sharinganSkill = { active: false, x: 0, y: 0, angle: 0, timer: null };

        function selectRole(role) {
            myRole = role;
            players[role].active = true;
            document.getElementById('btnP1').disabled = (role === 'p1');
            document.getElementById('btnP2').disabled = (role === 'p2');
            socket.emit('select_role', role);
        }

        socket.on('role_selected', (role) => {
            players[role].active = true;
            if (role === 'p1') document.getElementById('btnP1').disabled = true;
            if (role === 'p2') document.getElementById('btnP2').disabled = true;
        });

        function restartGame() {
            isGameOver = false;
            players.p1.hp = 5; players.p1.x = 50; players.p1.y = groundY - 80; players.p1.hitTimer = 0;
            players.p2.hp = 5; players.p2.x = 370; players.p2.y = groundY - 80; players.p2.hitTimer = 0;
            sharinganSkill.active = false;
            socket.emit('restart_game');
        }

        socket.on('game_restarted', () => {
            isGameOver = false;
            players.p1.hp = 5; players.p1.x = 50; players.p1.y = groundY - 80; players.p1.hitTimer = 0;
            players.p2.hp = 5; players.p2.x = 370; players.p2.y = groundY - 80; players.p2.hitTimer = 0;
            sharinganSkill.active = false;
        });

        let keys = {};
        window.addEventListener('keydown', (e) => { 
            let key = e.key.toLowerCase();
            keys[key] = true; 
            
            if (isGameOver) return; // Khóa điều khiển khi thua

            if ((key === 'w' || key === ' ') && myRole && players[myRole].isGrounded) {
                players[myRole].vy = jumpPower;
                players[myRole].isGrounded = false;
            }

            if (key === 'j' && myRole && !players[myRole].isAttacking) {
                performAttack();
            }

            if (key === 'e' && myRole === 'p1' && !sharinganSkill.active) {
                triggerSharingan();
            }
        });

        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function performAttack() {
            let me = players[myRole];
            let enemyRole = (myRole === 'p1') ? 'p2' : 'p1';
            let enemy = players[enemyRole];

            me.isAttacking = true;

            let attackRange = 90;
            let dist = Math.abs((me.x + me.size/2) - (enemy.x + enemy.size/2));

            if (dist <= attackRange) {
                if (!enemy.isBlocking) {
                    enemy.hp = Math.max(0, enemy.hp - 1);
                    enemy.hitTimer = 30;
                    enemy.x += me.direction * 15;
                }
            }

            setTimeout(() => { me.isAttacking = false; }, 250);
        }

        function triggerSharingan() {
            sharinganSkill.active = true;
            sharinganSkill.angle = 0;
            if (sharinganSkill.timer) clearTimeout(sharinganSkill.timer);

            let enemy = players.p2;
            if (!enemy.isBlocking) {
                enemy.hp = Math.max(0, enemy.hp - 1);
                enemy.hitTimer = 30;
            }

            sharinganSkill.timer = setTimeout(() => {
                sharinganSkill.active = false;
            }, 2000);
        }

        function updateGame() {
            if (!isGameOver && myRole && players[myRole]) {
                let p = players[myRole];
                p.isBlocking = keys['k'] || false;

                if (keys['a']) {
                    p.x = Math.max(0, p.x - 4);
                    p.direction = -1;
                    p.walkFrame += 0.25;
                } else if (keys['d']) {
                    p.x = Math.min(canvas.width - p.size, p.x + 4);
                    p.direction = 1;
                    p.walkFrame += 0.25;
                } else {
                    p.walkFrame = 0;
                }

                p.vy += gravity;
                p.y += p.vy;

                if (p.y + p.size >= groundY) {
                    p.y = groundY - p.size;
                    p.vy = 0;
                    p.isGrounded = true;
                }

                if (p.hitTimer > 0) p.hitTimer--;

                socket.emit('update_player', { role: myRole, data: p });
            }

            socket.on('player_updated', (data) => {
                if (data.role !== myRole) {
                    players[data.role] = { ...players[data.role], ...data.data };
                }
            });

            // KIỂM TRA ĐIỀU KIỆN GAME OVER
            if (players.p1.hp <= 0 || players.p2.hp <= 0) {
                isGameOver = true;
            }

            if (sharinganSkill.active) {
                sharinganSkill.x = players.p2.x + players.p2.size / 2;
                sharinganSkill.y = players.p2.y + 10;
                sharinganSkill.angle += 0.1;
            }

            drawGame();
            requestAnimationFrame(updateGame);
        }

        function drawGame() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Đường mặt đất
            ctx.fillStyle = '#8e44ad';
            ctx.fillRect(0, groundY, canvas.width, 5);
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(0, groundY + 5, canvas.width, canvas.height - groundY - 5);

            if (players.p1.active) drawCharacter(players.p1, p1Img, '#6c5ce7', 'P1');
            if (players.p2.active) drawCharacter(players.p2, p2Img, '#e74c3c', 'P2');

            // SHARINGAN XOAY
            if (sharinganSkill.active && !isGameOver) {
                ctx.save();
                ctx.translate(sharinganSkill.x, sharinganSkill.y);
                ctx.rotate(sharinganSkill.angle);
                if (sharinganImg.complete && sharinganImg.naturalWidth !== 0) {
                    ctx.drawImage(sharinganImg, -35, -35, 70, 70);
                } else {
                    ctx.fillStyle = 'red';
                    ctx.beginPath();
                    ctx.arc(0, 0, 30, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // Thanh máu
            ctx.fillStyle = '#2d3436';
            ctx.font = 'bold 15px Arial';
            if (players.p1.active) ctx.fillText(`P1: ${'❤️'.repeat(players.p1.hp)}`, 15, 25);
            if (players.p2.active) ctx.fillText(`P2: ${'❤️'.repeat(players.p2.hp)}`, 360, 25);

            // HIỂN THỊ MÀN HÌNH GAME OVER
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff4d4d';
                ctx.font = 'bold 42px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

                let winner = (players.p1.hp > 0) ? 'PLAYER 1 CHIẾN THẮNG! 🏆' : (players.p2.hp > 0) ? 'PLAYER 2 CHIẾN THẮNG! 🏆' : 'HÒA NHANH!';
                ctx.fillStyle = '#ffeaa7';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(winner, canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function drawCharacter(p, img, fallbackColor, label) {
            ctx.save();
            let centerX = p.x + p.size / 2;
            let centerY = p.y + p.size / 2;

            let bounceY = 0;
            let tiltAngle = 0;
            if (p.walkFrame > 0 && p.isGrounded && !isGameOver) {
                bounceY = Math.sin(p.walkFrame * 2) * 5;
                tiltAngle = Math.cos(p.walkFrame) * 0.1 * p.direction;
            }

            let hitShakeX = 0;
            if (p.hitTimer > 0) {
                hitShakeX = Math.sin(p.hitTimer * 0.5) * 3;
            }

            ctx.translate(centerX + hitShakeX, centerY + bounceY);
            ctx.rotate(tiltAngle);

            if (p.direction === -1) {
                ctx.scale(-1, 1);
            }

            if (p.hitTimer > 0) {
                ctx.filter = 'brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(5)';
            }

            if (img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, -p.size / 2, -p.size / 2, p.size, p.size);
            } else {
                ctx.fillStyle = fallbackColor;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(label, 0, 5);
            }

            ctx.filter = 'none';

            // VỆT CHÉM ĐÁNH THƯỜNG
            if (p.isAttacking) {
                ctx.beginPath();
                ctx.strokeStyle = '#ff7675';
                ctx.lineWidth = 8;
                ctx.arc(15, 0, 45, -Math.PI / 3, Math.PI / 3);
                ctx.stroke();

                ctx.beginPath();
                ctx.strokeStyle = '#ffeaa7';
                ctx.lineWidth = 4;
                ctx.arc(15, 0, 45, -Math.PI / 3, Math.PI / 3);
                ctx.stroke();
            }

            ctx.restore();

            // KHIÊN BLOCK
            if (p.isBlocking && !isGameOver) {
                ctx.fillStyle = 'rgba(52, 152, 219, 0.4)';
                ctx.strokeStyle = '#2980b9';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(centerX, centerY, p.size / 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                
                ctx.font = '16px Arial';
                ctx.fillText('🛡️', centerX - 10, p.y - 10);
            }
        }

        updateGame();
    </script>
</body>
</html>
