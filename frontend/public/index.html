<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Wibu 2D - Itachi</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; touch-action: manipulation; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #2c3e50; gap: 20px; }
        .game-container { position: relative; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .select-player-box { display: flex; gap: 10px; }
        .btn-select { background: #00b894; color: #fff; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-active { background: #e67e22 !important; }
        #gameCanvas { border-radius: 8px; background: #fff; display: block; }
        .mobile-controls { display: flex; flex-direction: column; width: 100%; gap: 8px; }
        .control-row { display: flex; justify-content: space-between; width: 100%; }
        .touch-group { display: flex; gap: 6px; }
        .btn-touch { position: relative; width: 46px; height: 46px; border-radius: 50%; border: none; background: #555; color: #fff; font-size: 1rem; }
        .cd-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.7rem; color: #fff; pointer-events: none; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="select-player-box">
            <button id="btnP1" onclick="toggleRole('p1')" class="btn-select">Chọn Player 1</button>
            <button id="btnP2" onclick="toggleRole('p2')" class="btn-select">Chọn Player 2</button>
            <button onclick="restartGame()" class="btn-select" style="background:#0984e3">Chơi lại 🔄</button>
        </div>

        <canvas id="gameCanvas" width="500" height="400"></canvas>

        <div class="mobile-controls">
            <div class="control-row">
                <div class="touch-group">
                    <button class="btn-touch" id="btnLeft">◀</button>
                    <button class="btn-touch" id="btnRight">▶</button>
                    <button class="btn-touch" id="btnJump">▲</button>
                </div>
                <div class="touch-group">
                    <button class="btn-touch" id="btnBlock">🛡️<span id="cdBlock" class="cd-overlay" style="display:none;"></span></button>
                    <button class="btn-touch" id="btnAttack">⚔️<span id="cdAttack" class="cd-overlay" style="display:none;"></span></button>
                </div>
            </div>
            <div class="control-row" style="justify-content: flex-end;">
                <div class="touch-group">
                    <button class="btn-touch" id="btnSkill1">🗡️<span id="cdSkill1" class="cd-overlay" style="display:none;"></span></button>
                    <button class="btn-touch" id="btnSkill2">👁️<span id="cdSkill2" class="cd-overlay" style="display:none;"></span></button>
                    <button class="btn-touch" id="btnSkill3">👹<span id="cdSkill3" class="cd-overlay" style="display:none;"></span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io('https://congamewibu.onrender.com');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const p1Img = new Image(); p1Img.src = 'player1.png';
        const p2Img = new Image(); p2Img.src = 'player2.png';
        const kunaiImg = new Image(); kunaiImg.src = 'kunai.png';
        const sharinganImg = new Image(); sharinganImg.src = 'sharingan1.jpg';

        const groundY = 320;
        let myRole = null;
        let isGameOver = false;

        let players = {
            p1: { x: 50, y: groundY - 80, size: 80, vy: 0, isGrounded: true, hp: 5, direction: 1, isAttacking: false, isBlocking: false, hitTimer: 0, blockHits: 0, blockBreakTimer: 0 },
            p2: { x: 370, y: groundY - 80, size: 80, vy: 0, isGrounded: true, hp: 5, direction: -1, isAttacking: false, isBlocking: false, hitTimer: 0, blockHits: 0, blockBreakTimer: 0 }
        };

        let projectiles = [];
        let particles = [];
        let activeSharinganEffects = []; // Quản lý hiệu ứng Sharingan đè lên người

        let cooldowns = { attack: 0, skill1: 0, skill2: 0, skill3: 0 };
        let keyState = {}; // Tránh spam phím khi giữ phím

        socket.on('init_state', (data) => {
            if (data.gameState.p1) players.p1 = { ...players.p1, ...data.gameState.p1 };
            if (data.gameState.p2) players.p2 = { ...players.p2, ...data.gameState.p2 };
            projectiles = data.projectiles || [];
        });

        function toggleRole(role) {
            myRole = (myRole === role) ? null : role;
            socket.emit('toggle_role', role);
            document.getElementById('btnP1').className = myRole === 'p1' ? 'btn-select btn-active' : 'btn-select';
            document.getElementById('btnP2').className = myRole === 'p2' ? 'btn-select btn-active' : 'btn-select';
        }

        function restartGame() { socket.emit('restart_game'); }

        socket.on('game_restarted', (data) => {
            isGameOver = false;
            players.p1 = { ...players.p1, ...data.gameState.p1 };
            players.p2 = { ...players.p2, ...data.gameState.p2 };
            projectiles = [];
            particles = [];
            activeSharinganEffects = [];
        });

        // Bắt sự kiện phím
        window.addEventListener('keydown', (e) => {
            let key = e.key.toLowerCase();
            if (keyState[key]) return; // Ngăn kích hoạt liên tục khi đè giữ phím
            keyState[key] = true;

            if (isGameOver || !myRole) return;

            if ((key === 'w' || key === ' ') && players[myRole].isGrounded) {
                players[myRole].vy = -12; players[myRole].isGrounded = false;
            }
            if (key === 'j') performAttack();
            if (key === 'u') useSkill1();
            if (key === 'i') useSkill2();
        });

        window.addEventListener('keyup', (e) => {
            let key = e.key.toLowerCase();
            keyState[key] = false;
        });

        function performAttack() {
            if (cooldowns.attack > 0) return;
            cooldowns.attack = 30; // 0.5s
            socket.emit('attack', myRole);
        }

        function useSkill1() {
            if (cooldowns.skill1 > 0) return;
            cooldowns.skill1 = 120; // 2s
            socket.emit('skill_kunai', myRole);
        }

        function useSkill2() {
            if (cooldowns.skill2 > 0) return;
            cooldowns.skill2 = 180; // 3s
            socket.emit('skill_sharingan', myRole);
        }

        // Kích hoạt hiệu ứng Mắt Sharingan trúng địch
        socket.on('trigger_sharingan_effect', (data) => {
            activeSharinganEffects.push({
                targetRole: data.targetRole,
                timer: 45 // Hiện trong 0.75 giây
            });
        });

        socket.on('block_broken', (data) => {
            let p = players[data.role];
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: p.x + 40, y: p.y + 40,
                    vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                    size: 6, life: 30, color: '#e74c3c'
                });
            }
        });

        socket.on('game_state_sync', (data) => {
            if (data.gameState.p1) players.p1 = { ...players.p1, ...data.gameState.p1 };
            if (data.gameState.p2) players.p2 = { ...players.p2, ...data.gameState.p2 };
        });

        socket.on('projectiles_update', (data) => { projectiles = data; });

        function updateGame() {
            // Giảm Cooldown UI
            for (let k in cooldowns) {
                if (cooldowns[k] > 0) cooldowns[k]--;
                let el = document.getElementById('cd' + k.charAt(0).toUpperCase() + k.slice(1));
                if (el) {
                    el.style.display = cooldowns[k] > 0 ? 'flex' : 'none';
                    if (cooldowns[k] > 0) el.innerText = (cooldowns[k] / 60).toFixed(1) + 's';
                }
            }

            if (!isGameOver && myRole && players[myRole]) {
                let p = players[myRole];
                if (p.blockBreakTimer > 0) { p.blockBreakTimer--; p.isBlocking = false; }
                else { p.isBlocking = keyState['k'] || false; }

                if (keyState['a']) { p.x = Math.max(0, p.x - 4); p.direction = -1; }
                else if (keyState['d']) { p.x = Math.min(canvas.width - p.size, p.x + 4); p.direction = 1; }

                p.vy += 0.6; p.y += p.vy;
                if (p.y + p.size >= groundY) { p.y = groundY - p.size; p.vy = 0; p.isGrounded = true; }

                socket.emit('update_player', { role: myRole, data: p });
            }

            // Di chuyển & Tính va chạm đạn
            projectiles.forEach((proj) => {
                proj.x += proj.vx;
                if (myRole && proj.owner !== myRole) {
                    let target = players[myRole];
                    if (proj.x > target.x && proj.x < target.x + target.size &&
                        proj.y > target.y && proj.y < target.y + target.size) {
                        socket.emit('hit_projectile', { projId: proj.id });
                    }
                }
            });

            // Giảm timer hiệu ứng Sharingan
            activeSharinganEffects.forEach((eff, idx) => {
                eff.timer--;
                if (eff.timer <= 0) activeSharinganEffects.splice(idx, 1);
            });

            particles.forEach((part, idx) => {
                part.x += part.vx; part.y += part.vy; part.life--;
                if (part.life <= 0) particles.splice(idx, 1);
            });

            if (players.p1.hp <= 0 || players.p2.hp <= 0) isGameOver = true;

            drawGame();
            requestAnimationFrame(updateGame);
        }

        function drawGame() {
            // XÓA SẠCH CANVAS MỖI FRAME (Chống dính vết)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ sàn đấu
            ctx.fillStyle = '#8e44ad'; ctx.fillRect(0, groundY, canvas.width, 5);
            ctx.fillStyle = '#f39c12'; ctx.fillRect(0, groundY + 5, canvas.width, canvas.height - groundY - 5);

            drawCharacter(players.p1, p1Img, '#6c5ce7');
            drawCharacter(players.p2, p2Img, '#e74c3c');

            // Vẽ đạn độc lập
            projectiles.forEach((proj) => {
                ctx.save();
                ctx.translate(proj.x, proj.y);
                if (proj.type === 'kunai') {
                    if (kunaiImg.complete && kunaiImg.naturalWidth > 0) {
                        ctx.drawImage(kunaiImg, -15, -15, 30, 30);
                    } else {
                        ctx.fillStyle = '#333'; ctx.fillRect(-10, -3, 20, 6);
                    }
                } else if (proj.type === 'sharingan') {
                    // Cục đỏ Sharingan đơn lẻ
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            });

            // Vẽ HIỆU ỨNG SHARINGAN HIỆN TRÊN ĐỊCH KHI TRÚNG ĐÒN
            activeSharinganEffects.forEach((eff) => {
                let victim = players[eff.targetRole];
                ctx.save();
                ctx.globalAlpha = eff.timer / 45; // Nhấp nháy mờ dần
                if (sharinganImg.complete && sharinganImg.naturalWidth > 0) {
                    ctx.drawImage(sharinganImg, victim.x - 10, victim.y - 10, victim.size + 20, victim.size + 20);
                } else {
                    ctx.fillStyle = 'rgba(231, 76, 60, 0.7)';
                    ctx.beginPath();
                    ctx.arc(victim.x + 40, victim.y + 40, 45, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });

            // Mảnh vỡ khiên
            particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });

            // Máu
            ctx.fillStyle = '#000'; ctx.font = 'bold 14px Arial';
            ctx.fillText(`P1: ${'❤️'.repeat(players.p1.hp)}`, 10, 20);
            ctx.fillText(`P2: ${'❤️'.repeat(players.p2.hp)}`, 370, 20);
        }

        function drawCharacter(p, img, color) {
            ctx.save();
            ctx.translate(p.x + 40, p.y + 40);
            if (p.direction === -1) ctx.scale(-1, 1);

            if (img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, -40, -40, 80, 80);
            } else {
                ctx.fillStyle = color; ctx.fillRect(-40, -40, 80, 80);
            }
            ctx.restore();

            // Vòng bảo vệ Block
            if (p.isBlocking && p.blockBreakTimer === 0) {
                ctx.strokeStyle = p.blockHits === 1 ? '#f39c12' : '#3498db';
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(p.x + 40, p.y + 40, 45, 0, Math.PI * 2); ctx.stroke();
            }
        }

        updateGame();
    </script>
</body>
</html>
